name: Build and Deploy

on: 
  push:
    branches: [main]
      # Publish semver tags as releases.
    tags: ["v*.*.*"]
    paths-ignore:
      - "README.md"
      - ".vscode/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io  
  IMAGE_NAME: ${{ github.repository }}
  AZURE_EVENTHUB_KEY: ${{ secrets.AZURE_EVENTHUB_KEY }}
  API_HOSTNAME: api.royerm.fr

jobs:
  set-env:
      name: Set Environment Variables
      runs-on: ubuntu-latest
      outputs:
        version: ${{ steps.main.outputs.version }}
        created: ${{ steps.main.outputs.created }}
        repository: ${{ steps.main.outputs.repository }}
      steps:
        - id: main
          run: |
            echo ::set-output name=version::$(echo ${GITHUB_SHA} | cut -c1-7)
            echo ::set-output name=created::$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            echo ::set-output name=repository::$GITHUB_REPOSITORY
  package-services:
    runs-on: ubuntu-latest
    needs: set-env
    permissions:
      contents: read
      packages: write
    outputs:
      containerImage-node: ${{ steps.image-tag.outputs.image-node-service }}
      containerImage-python: ${{ steps.image-tag.outputs.image-python-service }}
      containerImage-go: ${{ steps.image-tag.outputs.image-go-service }}
    strategy:
      matrix:
        services:
          [
            { "appName": "node-service", "directory": "./node-service" },
            { "appName": "python-service", "directory": "./python-service" },
            { "appName": "go-service", "directory": "./go-service" },
          ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN}}
      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: ${{ env.REGISTRY }}/${{ needs.set-env.outputs.repository }}/${{ matrix.services.appName }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha            
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.services.directory }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AUTH0_CLIENT_ID=${{ secrets.AUTH0_CLIENT_ID }}
            AUTH0_SECRET=${{ secrets.AUTH0_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_DRIVE_FOLDER=${{ secrets.GOOGLE_DRIVE_FOLDER }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            COSMOS_KEY=${{ secrets.COSMOS_KEY }}
            GITHUB_TOKEN=${{ secrets.AZURE_GITHUB_PAT }}            
      - name: Output image tag
        id: image-tag
        run: |
          echo ::set-output name=image-${{ matrix.services.appName }}::${{ env.REGISTRY }}/$GITHUB_REPOSITORY/${{ matrix.services.appName }}:sha-${{ needs.set-env.outputs.version }} | tr '[:upper:]' '[:lower:]'
  
  deploy:
    # Deploy only on version tags (v*.*.*); pushes to main only build and push images.
    if: github.repository != 'Azure-samples/container-apps-store-api-microservice' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [package-services]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy bicep
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az group create -g ${{ secrets.RESOURCE_GROUP }} -l westeurope
            az deployment group create -g ${{ secrets.RESOURCE_GROUP }} -f ./deploy/main.bicep \
             -p \
                nodeImage='${{ needs.package-services.outputs.containerImage-node }}' \
                pythonImage='${{ needs.package-services.outputs.containerImage-python }}' \
                goImage='${{ needs.package-services.outputs.containerImage-go }}' \
                containerRegistry=${{ env.REGISTRY }} \
                containerRegistryUsername=${{ github.actor }} \
                containerRegistryPassword=${{ secrets.AZURE_GITHUB_PAT }}  \
                pubsubAccesskey=${{ secrets.AZURE_EVENTHUB_KEY }}  \
                statestoreMasterKey=${{ secrets.AZURE_COMSMOSDB_KEY }}

      # The frontend calls https://api.royerm.fr (DNS hosted at IONOS). Point it at the
      # current unicorn-bff FQDN and (re)bind the custom domain, since the bicep deploy
      # does not declare it and the environment's default domain can change.
      - name: Get unicorn-bff FQDN
        id: fqdn
        run: |
          fqdn=$(az deployment group show -g ${{ secrets.RESOURCE_GROUP }} -n main \
            --query properties.outputs.nodeFqdn.value -o tsv)
          echo "Backend FQDN: $fqdn"
          echo "value=$fqdn" >> "$GITHUB_OUTPUT"

      - name: Update api.royerm.fr CNAME at IONOS
        env:
          IONOS_API_KEY: ${{ secrets.IONOS_API_KEY }}
          ZONE: royerm.fr
          TARGET: ${{ steps.fqdn.outputs.value }}
        run: |
          set -euo pipefail
          api=https://api.hosting.ionos.com/dns/v1
          auth=(-H "X-API-Key: $IONOS_API_KEY" -H "Content-Type: application/json")
          # Print the IONOS error body on failure instead of hiding it behind curl -f.
          ionos() {
            local out
            out=$(curl -sS --fail-with-body "${auth[@]}" "$@") || { echo "IONOS API error ($*): $out" >&2; return 1; }
            printf '%s' "$out"
          }
          zone_id=$(ionos "$api/zones" | jq -r --arg z "$ZONE" '.[] | select(.name==$z) | .id')
          [ -n "$zone_id" ] || { echo "Zone $ZONE not found for this API key"; exit 1; }
          record_id=$(ionos "$api/zones/$zone_id?recordName=$API_HOSTNAME&recordType=CNAME" \
            | jq -r '.records[0].id // empty')
          if [ -n "$record_id" ]; then
            ionos -X PUT "$api/zones/$zone_id/records/$record_id" \
              -d "{\"content\":\"$TARGET\",\"ttl\":300,\"prio\":0,\"disabled\":false}" > /dev/null
          else
            ionos -X POST "$api/zones/$zone_id/records" \
              -d "[{\"name\":\"$API_HOSTNAME\",\"type\":\"CNAME\",\"content\":\"$TARGET\",\"ttl\":300}]" > /dev/null
          fi
          echo "$API_HOSTNAME -> $TARGET"

      - name: Wait for DNS propagation
        run: |
          for i in $(seq 1 40); do
            current=$(dig +short "$API_HOSTNAME" CNAME @8.8.8.8 | sed 's/\.$//')
            [ "$current" = "${{ steps.fqdn.outputs.value }}" ] && echo "DNS ok" && exit 0
            echo "Waiting for DNS ($current)..."; sleep 15
          done
          echo "DNS did not propagate in time"; exit 1

      - name: Bind custom domain with managed certificate
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade -y --only-show-errors
          rg=${{ secrets.RESOURCE_GROUP }}
          az containerapp hostname add -g "$rg" -n unicorn-bff --hostname "$API_HOSTNAME" --only-show-errors || true
          cert=$(az containerapp env certificate list -g "$rg" -n env-unicorn-dev --managed-certificates-only \
            --query "[?properties.subjectName=='$API_HOSTNAME'].id | [0]" -o tsv)
          if [ -n "$cert" ]; then
            az containerapp hostname bind -g "$rg" -n unicorn-bff --hostname "$API_HOSTNAME" \
              --environment env-unicorn-dev --certificate "$cert"
          else
            az containerapp hostname bind -g "$rg" -n unicorn-bff --hostname "$API_HOSTNAME" \
              --environment env-unicorn-dev --validation-method CNAME
          fi